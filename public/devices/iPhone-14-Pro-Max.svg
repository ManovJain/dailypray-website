  <path d="M1233 272a16 16 0 0 1 22 0" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M1237 278a10 10 0 0 1 14 0" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

